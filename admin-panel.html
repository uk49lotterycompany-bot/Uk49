<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK49 Panel</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f0f4f8;display:flex;justify-content:center;padding:15px}
.card{background:white;width:390px;border-radius:16px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
.btn{width:100%;padding:14px;background:#0d6efd;color:white;border:none;border-radius:8px;font-weight:bold;margin-top:10px;cursor:pointer}
.btn-green{background:#22c55e}.upload-box{border:2px dashed #0d6efd;border-radius:12px;padding:20px;background:#f0f7ff;cursor:pointer;text-align:center}
#dragArea{width:100%;background:white;border-radius:12px;position:relative;overflow:hidden;margin-top:12px;display:none;border:2px solid #0A2A5E}
#dragArea img{width:100%;height:auto;display:block}
#dragBtn{position:absolute;left:50%;top:85%;transform:translate(-50%,-50%);background:#0d6efd;color:white;padding:10px 18px;border-radius:8px;font-weight:bold;z-index:10}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center;color:#0A2A5E">UK 49 ADMIN PANEL ✅ FIXED</h2>
<div class="upload-box" id="box" onclick="document.getElementById('file').click()"><b id="boxText">Tap to Choose Image</b><input type="file" id="file" accept="image/*" hidden></div>
<div id="dragArea"><img id="img"><div id="dragBtn">Continue →</div></div>
<div id="msg" style="text-align:center;font-weight:bold;margin-top:10px;color:green"></div>
<button class="btn btn-green" onclick="upload()" style="font-size:18px">✅ UPLOAD NOW</button>
<div id="list"></div>
<button class="btn" style="background:orange" onclick="localStorage.removeItem('uk49_payments_final');location.reload()">Clear Storage</button>
</div>
<script>
let pays=JSON.parse(localStorage.getItem('uk49_payments_final')||'[]');
let sel=null;
let posX=50; let posY=85; let show=true;

document.getElementById('file').addEventListener('change', function(){
 let f=this.files[0];
 if(!f){return;}
 document.getElementById('boxText').innerText="Loading... "+f.name;
 let r=new FileReader();
 r.onload=function(e){
  let im=new Image();
  im.onload=function(){
   let c=document.createElement('canvas');
   let maxW=600;
   c.width=maxW;
   c.height=im.height*(maxW/im.width);
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   sel=c.toDataURL('image/jpeg',0.7);
   document.getElementById('img').src=sel;
   document.getElementById('dragArea').style.display='block';
   document.getElementById('msg').innerText="✅ Image Ready! Drag blue button if you want, then click UPLOAD NOW";
   document.getElementById('boxText').innerText="✅ Image Selected - Tap to change";
  };
  im.src=e.target.result;
 };
 r.readAsDataURL(f);
});

let dragBtn=document.getElementById('dragBtn');
let dragArea=document.getElementById('dragArea');
let dragging=false;
dragBtn.addEventListener('mousedown',()=>dragging=true);
dragBtn.addEventListener('touchstart',()=>dragging=true);
window.addEventListener('mouseup',()=>dragging=false);
window.addEventListener('touchend',()=>dragging=false);
window.addEventListener('mousemove',move);
window.addEventListener('touchmove',move);
function move(e){
 if(!dragging) return;
 let rc=dragArea.getBoundingClientRect();
 let cx=e.touches?e.touches[0].clientX:e.clientX;
 let cy=e.touches?e.touches[0].clientY:e.clientY;
 let x=((cx-rc.left)/rc.width)*100;
 let y=((cy-rc.top)/rc.height)*100;
 x=Math.max(5,Math.min(95,x));
 y=Math.max(5,Math.min(95,y));
 posX=x; posY=y;
 dragBtn.style.left=x+"%";
 dragBtn.style.top=y+"%";
}

function upload(){
 if(!sel){alert("First choose image - tap the dashed box");return;}
 pays.push({id:Date.now(),data:sel,btnX:posX,btnY:posY,showButton:true,order:pays.length+1});
 localStorage.setItem('uk49_payments_final',JSON.stringify(pays));
 document.getElementById('msg').innerText="✅ UPLOADED! Total: "+pays.length;
 render();
}
function render(){
 let l=document.getElementById('list');
 if(pays.length==0){l.innerHTML="<small>No images yet</small>";return;}
 let h="<hr><b>Uploaded "+pays.length+"</b>";
 pays.forEach((p,i)=>{
  h+=`<div style="display:flex;gap:10px;border:2px solid green;padding:8px;margin:8px 0;border-radius:8px"><img src="${p.data}" style="width:60px;height:auto"><div>Order ${p.order}<br><button onclick="pays.splice(${i},1);localStorage.setItem('uk49_payments_final',JSON.stringify(pays));render()" style="background:red;color:white;border:none;padding:4px 10px;border-radius:5px">Delete</button></div></div>`;
 });
 l.innerHTML=h;
}
render();
</script>
</body>
</html>
