<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK 49 Payments</title>
<style>
body{margin:0;background:#fff;font-family:Arial;overflow:hidden}
#box{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
#img{max-width:100%;max-height:100vh;object-fit:contain}
#btnContinue{position:absolute;left:5%;bottom:5%;width:90%;height:12%;background:rgba(255,0,0,0.1);border:2px dashed red;z-index:9999}
#btnBack{position:absolute;left:5%;top:10%;width:25%;height:6%;background:rgba(0,0,0,0.1);z-index:9999}
#top{position:absolute;top:0;left:0;width:100%;background:#0d1b4a;color:#fff;text-align:center;padding:10px;z-index:10}
</style>
</head>
<body>
<div id="top">Welcome <span id="name"></span></div>
<div id="box">
<img id="img" src="">
<button id="btnContinue" onclick="goNext()">CONTINUE - 10% FADED (CLICK ME)</button>
<button id="btnBack" onclick="goBack()">BACK</button>
</div>
<script>
let list=[]; let idx=0;
document.getElementById('name').innerText=localStorage.getItem('currentUser')||'Justice';
async function load(){
  let r=await fetch('payments.json?v='+Date.now());
  list=await r.json();
  list.sort((a,b)=>a.order-b.order);
  if(list.length==0){alert('NO IMAGES - Go to admin-panel and upload 2 images');return;}
  document.getElementById('img').src=list[0].data;
  idx=0;
}
function goNext(){
  if(idx < list.length-1){
    idx++;
    document.getElementById('img').src=list[idx].data;
  }else{
    alert('This is last image - no more pages');
  }
}
function goBack(){
  if(idx>0){
    idx--;
    document.getElementById('img').src=list[idx].data;
  }
}
load();
</script>
</body>
</html>
