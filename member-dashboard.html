<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK49 Dashboard</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f0f4f8}
.top{background:#0A2A5E;color:white;padding:15px;text-align:center}
.card{max-width:420px;margin:10px auto;background:white;border-radius:16px;padding:15px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.pay{position:relative;border:2px solid #0A2A5E;border-radius:12px;overflow:hidden;margin:15px 0;background:white}
.pay img{width:100%;height:auto;display:block}
.payBtn{position:absolute;transform:translate(-50%,-50%);background:#0d6efd;color:white;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div class="top"><h2 style="margin:0" id="welcome">Welcome 👑</h2><small>UK 49 Payments</small></div>
<div class="card"><div id="payments">Loading payments...</div></div>
<script>
let user=localStorage.getItem('uk49_current_user')||'Member';
document.getElementById('welcome').innerText='Welcome '+user+' 👑';
async function load(){
 try{
  let res=await fetch('payments.json?v='+Date.now());
  let pays=await res.json();
  pays.sort((a,b)=>a.order-b.order);
  if(pays.length==0){document.getElementById('payments').innerHTML='<p style="text-align:center">No payments yet</p>';return;}
  let h='';
  pays.forEach(p=>{
   h+=`<div class="pay"><img src="${p.data}">${p.showButton?`<div class="payBtn" style="left:${p.buttonX}%;top:${p.buttonY}%">Continue →</div>`:''}</div>`;
  });
  document.getElementById('payments').innerHTML=h;
 }catch(e){document.getElementById('payments').innerHTML='<p style="color:red">payments.json not found</p>';}
}
load();
</script>
</body>
</html>
