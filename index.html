<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your UK49 membership account.">
  <title>UK49 | Create Account</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --green: #087f5b;
      --dark-green: #056344;
      --background: #f3f7f5;
      --text: #172b24;
      --muted: #687a72;
      --border: #dce7e1;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      padding: 22px;
      text-align: center;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--green);
    }

    .logo span { color: #e2a52e; }

    .tagline {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    main {
      width: 100%;
      max-width: 460px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 24px;
    }

    .welcome h1 {
      font-size: 27px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .card {
      background: white;
      padding: 26px 22px;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(20,60,40,.06);
    }

    .card h2 { margin: 0 0 8px; }

    .description {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fcfefd;
      color: var(--text);
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid rgba(8,127,91,.15);
      border-color: var(--green);
    }

    .primary-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: var(--green);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary-button:hover { background: var(--dark-green); }

    .primary-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .notice {
      display: none;
      margin: 17px 0;
      padding: 13px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .notice.error {
      display: block;
      background: #fff0f0;
      color: #a11b1b;
    }

    .notice.success {
      display: block;
      background: #eaf8ef;
      color: #17663a;
    }

    .security-note {
      margin-top: 20px;
      padding: 13px;
      border-radius: 10px;
      background: #f2f8f4;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .login-link {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .login-link a {
      color: var(--green);
      font-weight: bold;
    }

    footer {
      padding: 20px 10px 30px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      main { margin: 25px auto; }
      .card { padding: 23px 18px; }
      .welcome h1 { font-size: 24px; }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">UK<span>49</span></div>
    <p class="tagline">Your membership starts here</p>
  </header>

  <main>

    <section class="welcome">
      <h1>Welcome to UK49</h1>
      <p>Create your account to get started.</p>
    </section>

    <section class="card">

      <h2>Sign Up</h2>
      <p class="description">Enter your details below.</p>

      <form id="signupForm">

        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            id="fullName"
            type="text"
            autocomplete="name"
            placeholder="Enter your full name"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            id="phone"
            type="tel"
            autocomplete="tel"
            placeholder="Enter your phone number"
            maxlength="20"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="Enter your email address"
            maxlength="254"
            required
          >
        </div>

        <div id="notice" class="notice"
          role="status" aria-live="polite"></div>

        <button id="submitButton" class="primary-button" type="submit">
          Create Account
        </button>

      </form>

      <div class="security-note">
        🔒 After signing up, check your email and click the confirmation
        link to continue.
      </div>

      <div class="login-link">
        Already registered?
        <a href="login.html">Login here</a>
      </div>

    </section>

  </main>

  <footer>
    <p>&copy; <span id="year"></span> UK49.</p>
    <p>Use only legitimate and authorized services.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://jtwrktxkkngbxrvifoax.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_7Jdnz6F1e0-OdSVmqIqqUg_LIkD_L0";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    document.getElementById("year").textContent =
      new Date().getFullYear();

    const form = document.getElementById("signupForm");
    const notice = document.getElementById("notice");
    const submitButton = document.getElementById("submitButton");

    function showNotice(message, type) {
      notice.className = "notice " + type;
      notice.textContent = message;
    }

    // Generate a temporary password that the member never sees.
    function generateTemporaryPassword() {
      const bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);

      return Array.from(bytes)
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("") + "Aa1!";
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const fullName =
        document.getElementById("fullName").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const email =
        document.getElementById("email").value.trim().toLowerCase();

      if (!fullName || !phone || !email) {
        showNotice("Please complete all fields.", "error");
        return;
      }

      if (!window.supabase || !window.supabase.createClient) {
        showNotice(
          "Signup service is unavailable. Refresh the page and try again.",
          "error"
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Please wait...";

      try {
        const temporaryPassword = generateTemporaryPassword();

        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: temporaryPassword,

            options: {
              emailRedirectTo:
                "https://uk49lotterycompany-bot.github.io/Uk49/verify.html",

              data: {
                full_name: fullName,
                phone: phone
              }
            }
          });

        if (error) throw error;

        if (!data.user) {
          throw new Error("Account creation failed. Please try again.");
        }

        showNotice(
          "Your registration was received. Check your email and click the confirmation link to continue.",
          "success"
        );

        form.reset();

      } catch (error) {
        console.error("UK49 signup error:", error);

        showNotice(
          error.message || "Registration failed. Please try again.",
          "error"
        );

      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
