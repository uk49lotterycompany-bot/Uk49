<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK49 Admin</title>
<style>
body{margin:0;background:#f0f4f8;display:flex;justify-content:center;padding:20px;font-family:Arial}
.card{background:white;width:360px;border-radius:16px;padding:25px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.1)}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin-top:15px;box-sizing:border-box}
.btn{width:100%;padding:14px;background:#0d6efd;color:white;border:none;border-radius:8px;font-weight:bold;margin-top:15px;cursor:pointer}
#err{display:none;background:#fee2e2;color:#b91c1c;padding:10px;border-radius:8px;margin-top:12px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2 style="color:#0A2A5E">👑 UK 49<br>Admin Login</h2>
<input id="p" type="password" placeholder="Password">
<button class="btn" onclick="login()">Login</button>
<div id="err">❌ Wrong Password</div>
</div>
<script>
function login(){
 if(document.getElementById('p').value.trim()==="Admin2025"){window.location.href="admin-panel.html";}
 else{document.getElementById('err').style.display="block";}
}
</script>
</body>
</html>
