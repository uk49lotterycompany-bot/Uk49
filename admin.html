<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginBox">
    <h2>Admin Login</h2>
    <input id="pass" type="password" placeholder="Admin Password">
    <button onclick="checkPass()">Login</button>
  </div>

  <div id="adminPanel" style="display:none;">
    <h2>ADMIN PANEL</h2>

    <h3>1. Post Today's Numbers</h3>
    <textarea id="normalNums" rows="3" cols="30" placeholder="Enter numbers: 5 12 23 34 45 49"></textarea><br>
    <button onclick="saveNums()">Save Numbers</button>

    <hr>
    <h3>2. Add New Member</h3>
    <input id="newUser" placeholder="Username">
    <input id="newPass" placeholder="Password">
    <button onclick="addMember()">Add Member</button>
    <div id="memberList" style="margin-top:15px;"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
