<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK49 Admin</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f0f4f8;display:flex;justify-content:center;padding:20px}
.card{background:white;width:390px;border-radius:16px;padding:25px;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center}
.header{background:#0A2A5E;color:white;padding:15px;border-radius:12px 12px 0 0;margin:-25px -25px 20px -25px;display:flex;justify-content:space-between}
.btn{width:100%;padding:14px;background:#0d6efd;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-green{background:#22c55e}
.upload-box{border:2px dashed #0d6efd;border-radius:12px;padding:25px;cursor:pointer;background:#f0f7ff}
#dragArea{width:100%;background:white;border-radius:12px;position:relative;overflow:hidden;margin-top:15px;display:none;border:2px solid #0A2A5E}
#dragArea img{width:100%;height:auto;display:block}
#dragBtn{position:absolute;left:50%;top:85%;transform:translate(-50%,-50%);background:#0d6efd;color:white;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:move;touch-action:none;z-index:10}
.switch{position:relative;display:inline-block;width:44px;height:24px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:24px;transition:.4s}
.slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.4s}
input:checked+.slider{background:#22c55e}
input:checked+.slider:before{transform:translateX(20px)}
#err{color:red;font-weight:bold;margin-top:10px;display:none;background:#fee2e2;padding:10px;border-radius:8px}
</style>
</head>
<body>
<div id="login" class="card">
<h2 style="color:#0A2A5E">👑 UK 49<br>Admin Login</h2>
<input id="p" type="password" placeholder="Password" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:8px;margin-top:15px">
<button class="btn" onclick="login()">Login</button>
<div id="err">❌ Wrong Password! Correct is Admin2025</div>
<p style="font-size:11px;color:#666;margin-top:10px">Password: Admin2025</p>
</div>

<div id="panel" class="card" style="display:none;text-align:left">
<div class="header"><span>UK 49 ADMIN</span><span>✅</span></div>
<h3>👤 Create Member</h3>
<div style="background:#f1f5f9;padding:12px;border-radius:10px">
<input id="mu" placeholder="Username" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:4px 0">
<input id="mp" placeholder="Password" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:4px 0">
<button class="btn btn-green" onclick="createM()">Create Member</button>
<div id="mlist" style="margin-top:8px"></div>
</div>
<hr>
<h3>🖼️ Upload Image</h3>
<div class="upload-box" onclick="document.getElementById('file').click()">
☁️+<br><b>Tap to Choose Image</b>
<input type="file" id="file" accept="image/*" hidden>
</div>
<div id="dragArea"><img id="img"><div id="dragBtn">Continue →</div></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;background:#f8fafc;padding:10px;border-radius:8px;border:1px solid #ddd">
<span>Button: <b id="t">SHOW</b> / HIDE Toggle</span>
<label class="switch"><input type="checkbox" id="tog" checked><span class="slider"></span></label>
</div>
<input id="ord" type="number" value="1" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:8px">
<button class="btn btn-green" style="font-size:16px" onclick="upload()">✅ UPLOAD IMAGE</button>
<div id="msg" style="text-align:center;font-weight:bold;margin-top:10px;color:green"></div>
<div id="list" style="margin-top:12px"></div>
<button class="btn" style="background:#eee;color:#333" onclick="location.reload()">Logout</button>
</div>

<script>
let members=JSON.parse(localStorage.getItem('uk49_members')||'{"test":{"password":"1234"}}');
let pays=JSON.parse(localStorage.getItem('uk49_payments_final')||'[]');
let sel=null,pos={x:50,y:85},show=true;

function login(){
 let v=document.getElementById('p').value.trim();
 let err=document.getElementById('err');
 if(v!=="Admin2025"){
  err.style.display='block';
  err.innerHTML="❌ Wrong Password! You typed: '"+v+"' <br>Correct is: Admin2025";
  return;
 }
 err.style.display='none';
 document.getElementById('login').style.display='none';
 document.getElementById('panel').style.display='block';
 document.getElementById('ord').value=pays.length+1;
 renderM();render();
}
function createM(){
 let u=document.getElementById('mu').value.trim(),p=document.getElementById('mp').value.trim();
 if(!u||!p){alert("Enter both");return}
 members[u]={password:p};
 localStorage.setItem('uk49_members',JSON.stringify(members));
 document.getElementById('mu').value="";document.getElementById('mp').value="";
 renderM();alert("Created "+u);
}
function renderM(){
 let h="<b>Members:</b><br>";
 for(let k in members){h+=`<div style="background:white;padding:5px 8px;border-radius:6px;margin:3px 0;display:flex;justify-content:space-between;font-size:12px"><span>${k} : ${members[k].password}</span><span style="color:red;cursor:pointer;font-weight:bold" onclick="delete members['${k}'];localStorage.setItem('uk49_members',JSON.stringify(members));renderM()">X</span></div>`}
 document.getElementById('mlist').innerHTML=h;
}
document.getElementById('tog').onchange=function(){
 show=this.checked;
 document.getElementById('t').innerText=show?"SHOW":"HIDE";
 document.getElementById('dragBtn').style.opacity=show?"1":"0.2";
};
document.getElementById('file').onchange=function(){
 let f=this.files[0];if(!f)return;
 let r=new FileReader();
 r.onload=e=>{
  let im=new Image();
  im.onload=()=>{
   let c=document.createElement('canvas'),max=800,sc=max/im.width;
   if(im.width>max){c.width=max;c.height=im.height*sc}else{c.width=im.width;c.height=im.height}
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   sel=c.toDataURL('image/jpeg',0.7);
   document.getElementById('img').src=sel;
   document.getElementById('dragArea').style.display='block';
   document.getElementById('msg').innerText="✅ Ready! Drag button then click UPLOAD";
   let b=document.getElementById('dragBtn'),a=document.getElementById('dragArea'),d=false;
   b.onmousedown=b.ontouchstart=e=>{d=true;e.preventDefault()};
   window.onmousemove=window.ontouchmove=e=>{
    if(!d)return;
    let rc=a.getBoundingClientRect(),cx=e.touches?e.touches[0].clientX:e.clientX,cy=e.touches?e.touches[0].clientY:e.clientY;
    let x=((cx-rc.left)/rc.width)*100,y=((cy-rc.top)/rc.height)*100;
    pos={x:Math.max(5,Math.min(95,x)),y:Math.max(5,Math.min(95,y))};
    b.style.left=pos.x+"%";b.style.top=pos.y+"%";
   };
   window.onmouseup=window.ontouchend=()=>d=false;
  };im.src=e.target.result;
 };r.readAsDataURL(f);
};
function upload(){
 if(!sel){alert("Choose image first");return}
 let o=parseInt(document.getElementById('ord').value)||pays.length+1;
 pays.push({id:Date.now(),data:sel,[STRIPPED]
 pays.sort((a,b)=>a.order-b.order);
 try{localStorage.setItem('uk49_payments_final',JSON.stringify(pays))}catch(e){alert("Storage full");return}
 document.getElementById('msg').innerText="🎉 UPLOADED! Total: "+pays.length;
 sel=null;document.getElementById('dragArea').style.display='none';document.getElementById('file').value="";
 document.getElementById('ord').value=pays.length+1;render();alert("SUCCESS!");
}
function render(){
 let l=document.getElementById('list');
 if(pays.length==0){l.innerHTML="<small style=color:red>No images yet</small>";return}
 let h=`<hr><b>Uploaded (${pays.length})</b>`;
 pays.forEach((p,i)=>{h+=`<div style="display:flex;gap:10px;border:1px solid #ddd;padding:8px;margin:6px 0;border-radius:8px"><img src="${p.data}" style="width:55px;height:75px;object-fit:contain"><div><b>Order ${p.order}</b><br><small>${p.showButton?"SHOW":"HIDE"}</small><br><button onclick="pays.splice(${i},1);localStorage.setItem('uk49_payments_final',JSON.stringify(pays));render()" style="background:red;color:white;border:none;padding:3px 8px;border-radius:5px">Delete</button></div></div>`});
 l.innerHTML=h;
}
</script>
</body>
</html>
